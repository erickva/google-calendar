# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - googleClientId
      - googleClientSecret
      - googleRefreshToken
    properties:
      googleClientId:
        type: string
        description: Google OAuth Client ID
      googleClientSecret:
        type: string
        description: Google OAuth Client Secret
      googleRefreshToken:
        type: string
        description: Google OAuth Refresh Token
      googleRedirectUri:
        type: string
        default: http://localhost
        description: Google OAuth Redirect URI
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        GOOGLE_CLIENT_ID: config.googleClientId,
        GOOGLE_CLIENT_SECRET: config.googleClientSecret,
        GOOGLE_REFRESH_TOKEN: config.googleRefreshToken,
        GOOGLE_REDIRECT_URI: config.googleRedirectUri || 'http://localhost'
      }
    })
  exampleConfig:
    googleClientId: 123456789-abcde.apps.googleusercontent.com
    googleClientSecret: your_client_secret_here
    googleRefreshToken: 1//0abcdefGHIJK
    googleRedirectUri: http://localhost
